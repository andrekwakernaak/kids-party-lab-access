<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab Access Control</title>
    <link rel="stylesheet" href="/shared.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap");

      body {
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(36, 120, 160, 0.2), transparent 50%),
          var(--bg);
      }

      .card {
        width: min(460px, 100%);
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 1.6rem;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-family: var(--font-display);
        font-size: 1.4rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      p {
        margin: 0 0 1.2rem;
        color: var(--muted);
        line-height: 1.5;
      }

      .links {
        display: grid;
        gap: 0.75rem;
      }

      .links a {
        display: block;
        text-decoration: none;
        text-align: center;
        padding: 0.95rem 1rem;
        border: 1px solid var(--line);
        color: var(--text);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .links a.primary {
        border-color: rgba(36, 224, 122, 0.5);
        box-shadow: var(--glow-green);
      }

      .links a.secondary {
        border-color: rgba(240, 180, 41, 0.45);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Lab Access Control</h1>
      <p>
        Kies het display-scherm voor de TV/laptop, of de bedieningspagina voor
        je telefoon.
      </p>
      <div class="links">
        <a class="primary" href="/display">Open display</a>
        <a class="secondary" href="/control">Open bediening</a>
      </div>
    </main>
  </body>
</html>
